plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "meteos-ui-kit-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
}

repositories {
    mavenCentral()
    // https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = "NeoForge"
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

sourcesJar {
    from(rootProject.file('LICENSE.txt')) {
        rename { "${it}_${mod_name}" }
    }
}

javadocJar {
    from(rootProject.file('LICENSE.txt')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    from(rootProject.file('LICENSE.txt')) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version': version,
            'minecraft_version': minecraft_version,
            'minecraft_version_range': minecraft_version_range,
            'mod_name': mod_name,
            'mod_author': mod_author,
            'mod_id': mod_id,
            'license': license,
            'description': project.description,
            'neoforge_dependency_range': "[${neoforge_version},)",
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'fabric_loader_version': fabric_loader_version,
            'java_version': java_version
    ]

    filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }
    inputs.properties(expandProps)
    // dsh-ops 的更新锁 sidecar 与目标文件同目录生成，不应被打进资源/产物。
    exclude '**/.dsh-ops-update-*.lock'
}

// 公开产物只包含本工程实现；编译环境由消费者自己的加载器提供。
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
            pom.withXml { asNode().children().removeAll { it instanceof Node && it.name() == 'dependencies' } }
        }
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// 平台自带 Minecraft 和加载器；它们不属于库的可传递依赖。
tasks.withType(GenerateModuleMetadata).configureEach {
    doLast {
        def metadata = new groovy.json.JsonSlurper().parse(outputFile.get().asFile)
        metadata.variants.each { variant ->
            variant.remove('dependencies')
            variant.remove('dependencyConstraints')
        }
        outputFile.get().asFile.text = groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson(metadata)) + '\n'
    }
}
def localMaven = providers.gradleProperty('meteos_ui_kit_maven_dir')
if (localMaven.isPresent()) {
    publishing.repositories.maven {
        name = 'MeteosLocal'
        url = uri(localMaven.get())
    }
}
tasks.withType(PublishToMavenRepository).configureEach {
    dependsOn rootProject.subprojects.collect { it.tasks.named('build') }
    doFirst {
        def coordinate = new File(new File(repository.url),
                "${publication.groupId.replace('.', '/')}/${publication.artifactId}/${publication.version}")
        if (coordinate.exists()) {
            throw new GradleException("已发布坐标不可覆盖：${coordinate}；内容变更请提升 version")
        }
    }
}

// Loom 的 POM 注入晚于 publication.withXml；在最终输出阶段统一去掉开发依赖。
tasks.withType(GenerateMavenPom).configureEach {
    doLast {
        def pomFile = destination
        pomFile.text = pomFile.getText('UTF-8').replaceAll('(?s)\\s*<dependencies>.*?</dependencies>', '')
    }
}
