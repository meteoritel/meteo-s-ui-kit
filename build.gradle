plugins {
    id 'fabric-loom' version '1.8.13' apply false
    id 'net.neoforged.moddev' version '2.0.49-beta' apply false
}

tasks.register('checkRepository', Exec) {
    group = 'verification'
    workingDir rootProject.projectDir
    commandLine providers.gradleProperty('repository_python').getOrElse('python'), '-B', rootProject.file('tools/run-check.py'), rootProject.file('tools/check-all.py')
}
tasks.register('checkPackaging', Exec) {
    group = 'verification'
    dependsOn ':common:assemble', ':fabric:assemble', ':neoforge:assemble'
    mustRunAfter tasks.named('checkRepository')
    workingDir rootProject.projectDir
    commandLine providers.gradleProperty('repository_python').getOrElse('python'), '-B', rootProject.file('tools/run-check.py'), rootProject.file('tools/check-packaging.py')
}
subprojects {
    plugins.withId('java') {
        tasks.named('check') {
            dependsOn rootProject.tasks.named('checkRepository'), rootProject.tasks.named('checkPackaging')
        }
    }
}

tasks.register('publishLibrary') {
    group = 'publishing'
    description = '构建并向专用本地仓库发布不可变版本。'
    if (providers.gradleProperty('meteos_ui_kit_maven_dir').isPresent()) {
        dependsOn subprojects.collect { it.tasks.named('publishMavenJavaPublicationToMeteosLocalRepository') }
    } else {
        doLast { throw new GradleException('请在用户级 gradle.properties 配置 meteos_ui_kit_maven_dir') }
    }
}
